# docs/design/phase-11.md §4: weekly, grouped updates for every ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /rk-nri
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /tests/packaging
    schedule:
      interval: weekly
    # The package test is the evidence for Rocky Linux 9 (docs/evidence.md,
    # install_upgrade_uninstall); a new major is a deliberate change, not an update.
    ignore:
      - dependency-name: "rockylinux/rockylinux"
        versions: [">= 10"]
