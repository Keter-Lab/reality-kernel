# docs/design/phase-11.md §4: weekly, grouped updates for every ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # bindgen 0.73 accepts syn 2 or 3 and prettyplease 0.2 or 0.3 independently,
    # so Cargo can build it on syn 3 against a syn-2 prettyplease and it fails to
    # compile (docs/design/phase-13.md). Revisit when upstream ties the two.
    ignore:
      - dependency-name: "bindgen"
        versions: [">= 0.73"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /rk-nri
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /tests/packaging
    schedule:
      interval: weekly
    # The package test is the evidence for Rocky Linux 9 (docs/evidence.md,
    # install_upgrade_uninstall); a new major is a deliberate change, not an update.
    ignore:
      - dependency-name: "rockylinux/rockylinux"
        versions: [">= 10"]
