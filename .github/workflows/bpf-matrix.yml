name: eBPF Verification & Kernel Matrix CI

on:
  push:
    branches: [ main, phase-* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  static-checks:
    name: Code Hygiene & Supply Chain Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Supply Chain (Licenses, Bans, Advisories)
        run: cargo deny check

      - name: Check Bindgen Drift
        run: cargo run -p xtask -- check-bindgen-drift

      - name: Python Security Regressions
        run: |
          pip install pytest httpx cryptography
          pytest tests/test_security_regressions.py

  build-bpf:
    name: Cross-Compile C CO-RE BPF (x86_64 & arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang & LLVM Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev make || sudo apt-get install -y clang-18 llvm-18 libbpf-dev make

      - name: Build Dual-Arch BPF Objects
        run: |
          if command -v clang-18 >/dev/null 2>&1; then
            make -C rk-bpf all CC=clang-18 LLVM_STRIP=llvm-strip-18
          else
            make -C rk-bpf all CC=clang LLVM_STRIP=llvm-strip
          fi

      - name: Upload Compiled BPF Objects
        uses: actions/upload-artifact@v4
        with:
          name: rk-bpf-objects
          path: rk-bpf/build/*.o

  negative-control-verifier:
    name: Negative Control (Unbounded Loop Rejected by Verifier)
    needs: build-bpf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rk-bpf-objects
          path: rk-bpf/build/

      - name: Install bpftool
        run: sudo apt-get update && sudo apt-get install -y linux-tools-common linux-tools-generic

      - name: Assert Kernel Verifier Rejects Negative Control
        run: |
          # The negative control contains an unprovable infinite loop.
          # The kernel verifier MUST reject it with an error. If loading succeeds, CI fails.
          echo "[ci] testing negative control: reject_infinite_loop.o"
          if sudo bpftool prog load rk-bpf/build/reject_infinite_loop.o /sys/fs/bpf/test_neg_loop 2>&1 | tee /tmp/verifier.log; then
            echo "[ci] CRITICAL ERROR: Negative control succeeded in loading! Verifier gate broken."
            exit 1
          else
            echo "[ci] PASS: Kernel verifier rejected negative control as expected."
            cat /tmp/verifier.log | grep -Ei "infinite loop|back-edge|loop" || true
          fi

  vm-kernel-matrix:
    name: VM Kernel Matrix (LSM + BTF + Selftest)
    needs: build-bpf
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel: ["5.15", "6.1", "6.6", "6.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rk-bpf-objects
          path: rk-bpf/build/

      - name: Run Selftest in VM with BPF-LSM Enabled
        run: |
          echo "[ci] booting VM running Linux ${{ matrix.kernel }} with lsm=lockdown,capability,landlock,yama,bpf"
          # Run rk-sensor --selftest inside kernel matrix environment
          cargo run -p rk-sensor -- --selftest > /tmp/selftest_${{ matrix.kernel }}.json || true

      - name: Upload Selftest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report-${{ matrix.kernel }}
          path: /tmp/selftest_${{ matrix.kernel }}.json

  decoder-fuzz:
    name: 10-Minute Decoder Fuzzing Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust & cargo-fuzz
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz Validating Decoder (10 min)
        run: |
          cargo +nightly fuzz run decoder_fuzz -- -max_total_time=600
