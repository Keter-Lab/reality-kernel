name: Kernel

# Builds the BPF objects, embeds them in rk-sensor, and runs the selftest plus
# the verifier controls on real kernels in VMs. No step here may be allowed to
# fail silently: every check either passes or turns the run red.

on:
  push:
    branches: [main, "phase-*"]
    # Changes that cannot affect what runs in the VMs or kind skip the matrix
    # on push (docs/design/phase-8.md §3.7). Pull requests always run it, so
    # nothing reaches main without the full matrix. Files this workflow reads
    # (bench gate and budget, traceability script and index, conformance
    # cases) are deliberately not listed.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "assets/**"
      - "tests/test_*.py"
      - "tests/coverage_summary.py"
      - ".github/workflows/ci.yml"
      - ".github/workflows/autofix.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/scorecard.yml"
      - ".github/workflows/dco.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/install-signing-tools.sh"
      - ".github/scripts/dco_check.py"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "requirements-ci.txt"
      - "tests/readme_claims.py"
      - "public/**"
      - "scripts/partials.py"
      - "vercel.json"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VMTEST_VERSION: v0.18.0
  VMTEST_SHA256: 63270a3f763f97f268e0ee8d3591f79b6ff17ece7b6dff8f9440207bb04b64f3
  BPFTOOL_VERSION: v7.7.0
  BPFTOOL_SHA256: 09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c
  # Boot-time LSM list for the VMs; unknown names are ignored by older kernels.
  VM_LSM: lockdown,capability,landlock,yama,bpf
  # Phase 5b kind cluster (docs/design/phase-5b.md §8).
  KIND_VERSION: v0.32.0
  KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
  KIND_NODE_IMAGE: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
  HELM_VERSION: v3.22.1
  HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea

jobs:
  bpf-build:
    name: Build BPF objects (x86, arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang, llvm, libbpf headers
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev make

      - name: Build (-Wall -Werror)
        run: .github/scripts/run-logged.sh "bpf build" make -C rk-bpf all-arches

      - name: Check BTF sections are present (needed for CO-RE)
        run: |
          set -euo pipefail
          for obj in rk-bpf/build/*/*.bpf.o; do
            # Capture first: grep -q closing the pipe early would SIGPIPE readelf under pipefail.
            sections=$(llvm-readelf -S "$obj")
            grep -qE '[[:space:]]\.BTF[[:space:]]' <<<"$sections" || { echo "::error::$obj has no .BTF section"; exit 1; }
            echo "ok: $obj"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bpf-objects
          path: rk-bpf/build/
          if-no-files-found: error

  sensor:
    name: Build rk-sensor (${{ matrix.arch }})
    needs: bpf-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-objects
          path: rk-bpf/build/

      - name: Install libclang (bindgen) and musl tools
        run: sudo apt-get update && sudo apt-get install -y libclang-dev musl-tools

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Test with embedded objects
        run: .github/scripts/run-logged.sh "rk-sensor tests (embedded)" cargo test -p rk-sensor --features embedded-bpf

      - name: Release build (static, embedded objects)
        run: |
          .github/scripts/run-logged.sh "rk-sensor release build" cargo build --release -p rk-sensor --features embedded-bpf --target ${{ matrix.target }}
          .github/scripts/run-logged.sh "rk-integration release build" cargo build --release -p rk-integration --features embedded-bpf --target ${{ matrix.target }}
          .github/scripts/run-logged.sh "rk release build" cargo build --release -p rk-cli --target ${{ matrix.target }}

      # Phase 10 §7: a second sensor embedding the `next` object variant, so
      # the upgrade suite and the package tests replace one object with another.
      - name: Release build of rk-sensor-next (upgrade-test variant)
        run: |
          out=target/${{ matrix.target }}/release
          cp "$out/rk-sensor" "$out/rk-sensor.main"
          RK_BPF_VARIANT=next .github/scripts/run-logged.sh "rk-sensor-next release build" cargo build --release -p rk-sensor --features embedded-bpf --target ${{ matrix.target }}
          mv "$out/rk-sensor" "$out/rk-sensor-next"
          mv "$out/rk-sensor.main" "$out/rk-sensor"
          if cmp -s "$out/rk-sensor" "$out/rk-sensor-next"; then
            echo "::error::rk-sensor-next is identical to rk-sensor"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rk-sensor-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/rk-sensor
            target/${{ matrix.target }}/release/rk-sensor-next
            target/${{ matrix.target }}/release/rk-integration
            target/${{ matrix.target }}/release/rk
          if-no-files-found: error

  vm-matrix:
    name: Verifier + selftest (Linux ${{ matrix.kernel }})
    needs: sensor
    runs-on: ubuntu-24.04
    # Covers a cold 5.15 kernel build (~20 min). A hang inside the VM is cut
    # off much earlier by the `timeout` around vmtest.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # LVH kernel images (quay.io/lvh-images/kernel-images), pinned by digest.
        # Refresh procedure: docs/kernel-matrix.md.
        include:
          # The LVH 5.15 image lacks CONFIG_VIRTIO_CONSOLE, which vmtest needs, so the
          # same source is rebuilt from LVH's config with that option (cached).
          - kernel: "5.15"
            digest: sha256:d7ecc651bcdec5bda7477d32d2ba583dde1ed75db31f56dd78997b3c743a27b3
            source: "5.15.222"
            source_url: https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.15.222.tar.xz
            source_sha256: 4d6ec07679bd008524391cb67597106018646c6378b3953c23ec69b9259cdf84
          - kernel: "6.1"
            digest: sha256:9e883377d6112141d1508f5090a5329c94be2bca1a4016964eddf9df3c549d09
          - kernel: "6.6"
            digest: sha256:6a95b95c69f22dac5cb6fe81556e399c860aff38dcf8d8ff66cac18cabedab27
          - kernel: "6.12"
            digest: sha256:c4bcdbcc3d5e9c5094ba806f2661b2e9c870233df1bf77ff2aa5d4f6cbf6a374
          - kernel: "6.18"
            digest: sha256:8f08ba5cd89ce8d2796413d243e81b4b5db60db22d3c3bd62160641e04e98365
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-objects
          path: rk-bpf/build/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rk-sensor-x86_64
          path: bin/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        # vmtest kernel mode runs the host's qemu-ga inside the guest.
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils qemu-guest-agent

      - name: Fetch pinned vmtest and bpftool
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL -o tools/vmtest "https://github.com/danobi/vmtest/releases/download/${VMTEST_VERSION}/vmtest-x86_64"
          echo "${VMTEST_SHA256}  tools/vmtest" | sha256sum -c -
          curl -fsSL -o bpftool.tar.gz "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz"
          echo "${BPFTOOL_SHA256}  bpftool.tar.gz" | sha256sum -c -
          tar -xzf bpftool.tar.gz -C tools
          chmod +x tools/vmtest tools/bpftool bin/rk-sensor bin/rk-sensor-next bin/rk-integration bin/rk

      - name: Extract kernel ${{ matrix.kernel }}
        run: |
          set -euo pipefail
          image="quay.io/lvh-images/kernel-images@${{ matrix.digest }}"
          id=$(docker create --platform linux/amd64 "$image" /bin/true)
          docker cp "$id:/data/kernels/${{ matrix.kernel }}/boot" kernel
          docker rm "$id"
          ls -l kernel
          echo "KERNEL_IMAGE=$(ls "$PWD"/kernel/vmlinuz-*)" >> "$GITHUB_ENV"
          grep -E '^CONFIG_(BPF_LSM|DEBUG_INFO_BTF|CGROUP_BPF|BPF_SYSCALL|SECURITY_PATH|LSM)=' kernel/config-* || true

      - name: Restore source-built kernel
        if: matrix.source
        id: kernel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernel-build/bzImage
          key: kernel-${{ matrix.source }}-${{ matrix.digest }}-virtio-console-v1

      - name: Build kernel ${{ matrix.source }} (LVH config + CONFIG_VIRTIO_CONSOLE)
        if: matrix.source && steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y build-essential flex bison bc libelf-dev libssl-dev dwarves
          curl -fsSL -o linux.tar.xz "${{ matrix.source_url }}"
          echo "${{ matrix.source_sha256 }}  linux.tar.xz" | sha256sum -c -
          tar -xf linux.tar.xz
          cd "linux-${{ matrix.source }}"
          cp ../kernel/config-* .config
          scripts/config --enable VIRTIO_CONSOLE
          make olddefconfig
          grep -q '^CONFIG_VIRTIO_CONSOLE=y' .config
          ../.github/scripts/run-logged.sh "kernel build" make -j"$(nproc)" bzImage
          mkdir -p ../kernel-build
          cp arch/x86/boot/bzImage ../kernel-build/bzImage

      - name: Use source-built kernel
        if: matrix.source
        run: echo "KERNEL_IMAGE=$PWD/kernel-build/bzImage" >> "$GITHUB_ENV"

      - name: Run selftest and verifier controls in the VM
        run: |
          set -o pipefail
          # The whole VM session normally takes ~2 minutes; fail fast on a hang.
          timeout --kill-after=30 900 tools/vmtest -k "$KERNEL_IMAGE" --kargs "lsm=${VM_LSM}" \
            "bash $PWD/tests/vm/selftest.sh $PWD/bin/rk-sensor $PWD/rk-bpf/build/x86 $PWD/tools/bpftool $PWD/bin/rk-integration $PWD/bin/rk" \
            2>&1 | tee vm.log
          rc=${PIPESTATUS[0]}
          sed -n '/===RK_SELFTEST_BEGIN===/,/===RK_SELFTEST_END===/p' vm.log \
            | sed '1d;$d' > "selftest-${{ matrix.kernel }}.json"
          sed -n '/===RK_INTEGRATION_BEGIN===/,/===RK_INTEGRATION_END===/p' vm.log \
            | sed '1d;$d' > "integration-${{ matrix.kernel }}.json"
          sed -n '/===RK_AGENT_BEGIN===/,/===RK_AGENT_END===/p' vm.log \
            | sed '1d;$d' > "agent-${{ matrix.kernel }}.json"
          sed -n '/===RK_RESILIENCE_BEGIN===/,/===RK_RESILIENCE_END===/p' vm.log \
            | sed '1d;$d' > "resilience-${{ matrix.kernel }}.json"
          sed -n '/===RK_CONFORMANCE_BEGIN===/,/===RK_CONFORMANCE_END===/p' vm.log \
            | sed '1d;$d' > "conformance-${{ matrix.kernel }}.json"
          sed -n '/===RK_OBSERVABILITY_BEGIN===/,/===RK_OBSERVABILITY_END===/p' vm.log \
            | sed '1d;$d' > "observability-${{ matrix.kernel }}.json"
          sed -n '/===RK_UPGRADE_BEGIN===/,/===RK_UPGRADE_END===/p' vm.log \
            | sed '1d;$d' > "upgrade-${{ matrix.kernel }}.json"
          sed -n '/===RK_BENCH_BEGIN===/,/===RK_BENCH_END===/p' vm.log \
            | sed '1d;$d' > "bench-${{ matrix.kernel }}.json"
          if [ "$rc" -ne 0 ]; then
            .github/scripts/annotate.sh vm.log "Linux ${{ matrix.kernel }}"
            python3 - "selftest-${{ matrix.kernel }}.json" "integration-${{ matrix.kernel }}.json" "agent-${{ matrix.kernel }}.json" "resilience-${{ matrix.kernel }}.json" "conformance-${{ matrix.kernel }}.json" "observability-${{ matrix.kernel }}.json" "upgrade-${{ matrix.kernel }}.json" <<'PY'
          import json, os, sys
          for fname in sys.argv[1:]:
            if os.path.exists(fname) and os.path.getsize(fname) > 0:
              try:
                data = json.load(open(fname))
                if isinstance(data, list):
                  bad = [f"{c['name']}: {c['detail']}" for c in data if not c.get("passed", False)]
                elif isinstance(data, dict):
                  bad = [f"{p['object']}:{p['name']}: {p['error']}" for p in data.get("programs", []) if not p.get("loaded", False) and not p.get("probe", False)]
                  bad += [f"{c['name']}: {c['detail']}" for c in data.get("checks", []) if not c.get("passed", False)]
                  bad += [f"missing feature: {m}" for m in data.get("missing_features", [])]
                else:
                  bad = []
                if bad:
                  print("::error title=" + fname + "::" + "%0A".join(bad).replace("\n", "%0A")[:60000])
              except Exception as e:
                print(f"::error title={fname} parse error::{e}")
          PY
          fi
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selftest-${{ matrix.kernel }}
          path: |
            selftest-${{ matrix.kernel }}.json
            integration-${{ matrix.kernel }}.json
            agent-${{ matrix.kernel }}.json
            resilience-${{ matrix.kernel }}.json
            conformance-${{ matrix.kernel }}.json
            observability-${{ matrix.kernel }}.json
            upgrade-${{ matrix.kernel }}.json
            vm.log
          if-no-files-found: warn

      # Phase 7: each kernel's benchmark report, collected by bench-report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.kernel }}
          path: bench-${{ matrix.kernel }}.json
          if-no-files-found: warn

  bench-report:
    name: Benchmark report and budget gate
    needs: vm-matrix
    if: always() && needs.vm-matrix.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          merge-multiple: true
          path: bench/

      # docs/design/phase-7.md §7: report p50/p99 per hook per kernel, and fail
      # when a measurement exceeds tests/bench/budget.json.
      - name: Report and gate
        run: |
          set -o pipefail
          python3 tests/bench/gate.py tests/bench/budget.json bench/*.json | tee bench-report.md
          rc=${PIPESTATUS[0]}
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-report
          path: |
            bench-report.md
            bench/
          if-no-files-found: warn

  k8s:
    name: Kubernetes (kind, NRI)
    needs: sensor
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rk-sensor-x86_64
          path: bin/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rk-nri/go.mod
          cache-dependency-path: rk-nri/go.mod

      - name: Build rk-nri and the images
        run: |
          set -euo pipefail
          mkdir -p image/bin probe/bin
          (cd rk-nri && go mod tidy && CGO_ENABLED=0 go build -trimpath -o ../image/bin/rk-nri .)
          cp bin/rk-sensor bin/rk image/bin/
          cp bin/rk-integration probe/bin/
          chmod +x image/bin/* probe/bin/*
          docker build -f deploy/docker/Dockerfile -t reality-kernel:ci image
          docker build -f deploy/docker/Dockerfile -t rk-probe:ci probe

      - name: Fetch pinned kind and helm
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL -o tools/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  tools/kind" | sha256sum -c -
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz -C tools --strip-components=1 linux-amd64/helm
          chmod +x tools/kind tools/helm
          echo "$PWD/tools" >> "$GITHUB_PATH"

      - name: Create the kind cluster
        run: |
          set -euo pipefail
          echo "runner kernel: $(uname -r); active LSMs: $(cat /sys/kernel/security/lsm)"
          kind create cluster --name rk --image "$KIND_NODE_IMAGE" --wait 180s
          kind load docker-image --name rk reality-kernel:ci rk-probe:ci
          docker exec rk-control-plane containerd --version

      - name: Run the Kubernetes suite
        run: |
          set -o pipefail
          bash tests/k8s/run.sh rk-control-plane 2>&1 | tee k8s.log
          rc=${PIPESTATUS[0]}
          sed -n '/===RK_K8S_BEGIN===/,/===RK_K8S_END===/p' k8s.log | sed '1d;$d' > k8s.json
          if [ "$rc" -ne 0 ]; then
            jq -r '.[] | select(.passed | not) | "::error title=(.name)::(.detail)"' k8s.json || true
            kubectl -n reality-kernel logs ds/rk --all-containers --tail=100 > k8s-daemon.log 2>&1 || true
          fi
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k8s-results
          path: |
            k8s.json
            k8s.log
            k8s-daemon.log
            k8s-logs/
          if-no-files-found: warn

  # docs/design/phase-10.md §5: deb and rpm from the static binaries, plus the
  # release-2 packages whose sensor embeds the `next` object (upgrade test).
  package:
    name: Packages (deb, rpm)
    needs: sensor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rk-sensor-x86_64
          path: dist/bin-amd64/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rk-sensor-arm64
          path: dist/bin-arm64/

      - name: Install nFPM (pinned, checksum-verified)
        run: |
          set -euo pipefail
          v=2.47.0
          curl -sSfL -o /tmp/nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${v}/nfpm_${v}_Linux_x86_64.tar.gz"
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  /tmp/nfpm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build packages
        run: |
          set -euo pipefail
          chmod +x dist/bin-amd64/* dist/bin-arm64/*
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          deploy/packaging/build.sh amd64 dist/bin-amd64 "$version" 1 dist/packages
          deploy/packaging/build.sh arm64 dist/bin-arm64 "$version" 1 dist/packages
          mkdir -p dist/bin-next
          cp dist/bin-amd64/rk-sensor-next dist/bin-next/rk-sensor
          cp dist/bin-amd64/rk dist/bin-next/rk
          deploy/packaging/build.sh amd64 dist/bin-next "$version" 2 dist/packages-next
          cp dist/bin-amd64/rk-integration dist/packages-next/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/packages/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-next
          path: dist/packages-next/
          if-no-files-found: error

  # docs/design/phase-10.md §7: install, upgrade (to the `next` object, with a
  # gap probe running) and uninstall, on a systemd host per distribution.
  package-test:
    name: Package test (${{ matrix.distro }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            format: deb
          - distro: rockylinux-9
            format: rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-next
          path: dist/

      - name: Run the package suite
        run: |
          set +e -o pipefail
          chmod +x dist/rk-integration
          log="pkg-${{ matrix.distro }}.log"
          if [ "${{ matrix.format }}" = deb ]; then
            # The runner itself: real systemd, real dpkg.
            sudo tests/packaging/run.sh deb "$PWD/dist" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
          else
            docker build -t rk-rocky9 -f tests/packaging/rocky9.Containerfile tests/packaging
            docker run -d --name rk-rocky9 --privileged --cgroupns=private \
              --tmpfs /run --tmpfs /tmp -v "$PWD:/src:ro" rk-rocky9
            for _ in $(seq 1 60); do
              state="$(docker exec rk-rocky9 systemctl is-system-running 2>/dev/null)"
              case "$state" in running | degraded) break ;; esac
              sleep 1
            done
            echo "container systemd: $state"
            docker exec rk-rocky9 /src/tests/packaging/run.sh rpm /src/dist 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
          fi
          sed -n '/===RK_PKG_BEGIN===/,/===RK_PKG_END===/p' "$log" | sed '1d;$d' > "pkg-${{ matrix.distro }}.json"
          if [ "$rc" -ne 0 ]; then
            .github/scripts/annotate.sh "$log" "Package test ${{ matrix.distro }}"
          fi
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pkg-${{ matrix.distro }}
          path: |
            pkg-${{ matrix.distro }}.json
            pkg-${{ matrix.distro }}.log
          if-no-files-found: warn

  traceability:
    name: Traceability (every criterion's tests passed)
    needs: [vm-matrix, k8s, package-test]
    if: always() && needs.vm-matrix.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: selftest-*
          merge-multiple: true
          path: reports/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k8s-results
          path: reports/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          merge-multiple: true
          path: reports/

      # docs/design/phase-8.md §3.1: a deleted, renamed, skipped or failing test
      # fails against the criterion it proves, on every kernel.
      - name: Check the reports
        run: |
          set -o pipefail
          python3 tests/traceability.py reports --kernels 5.15,6.1,6.6,6.12,6.18 \
            --distros ubuntu-24.04,rockylinux-9 reports/ \
            | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Decoder and policy fuzzing (2 x 5 min)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-fuzz

      - name: Fuzz the decoder
        run: |
          .github/scripts/run-logged.sh "decoder fuzz" cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decoder_fuzz -- -max_total_time=300 -rss_limit_mb=2048
          .github/scripts/run-logged.sh "policy fuzz" cargo +nightly fuzz run --target x86_64-unknown-linux-gnu policy_fuzz -- -max_total_time=300 -rss_limit_mb=2048
