name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt, clippy, deny, audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny,cargo-audit

      # On phase-* pushes autofix commits the formatting, so a rustfmt miss
      # must not hide the clippy, deny and audit results (docs/design/phase-8.md
      # §3.7). Pull requests and main stay strict.
      - name: rustfmt
        continue-on-error: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/phase-') }}
        run: .github/scripts/run-logged.sh rustfmt cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: .github/scripts/run-logged.sh clippy cargo clippy --workspace --all-targets --keep-going -- -D warnings

      - name: cargo-deny (licenses, bans, sources, advisories)
        run: .github/scripts/run-logged.sh cargo-deny cargo deny check

      - name: cargo-audit
        run: .github/scripts/run-logged.sh cargo-audit cargo audit

  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Includes the ABI layout assertions, which therefore run natively on both arches.
      - name: cargo test
        run: .github/scripts/run-logged.sh "cargo test (${{ matrix.arch }})" cargo test --workspace

  # docs/design/phase-15.md: the declared minimum Rust version
  # (workspace rust-version) is proven, not assumed. Builds every crate and
  # test target on exactly that toolchain with the committed Cargo.lock.
  msrv:
    name: Minimum Rust version (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Fails if the toolchain here and rust-version in Cargo.toml disagree.
      - name: toolchain matches rust-version
        run: |
          declared=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          actual=$(rustc --version | cut -d' ' -f2 | cut -d. -f1,2)
          echo "declared $declared, toolchain $actual"
          test "$declared" = "$actual"

      - name: cargo check (all targets, locked)
        run: .github/scripts/run-logged.sh msrv cargo check --workspace --all-targets --locked

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # docs/design/phase-11.md §4: exact versions, verified by hash.
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: pytest
        run: .github/scripts/run-logged.sh pytest pytest tests/ -v

      # docs/design/phase-8.md §3.1: every acceptance criterion maps to tests
      # that exist in the source.
      - name: traceability (source)
        run: python3 tests/traceability.py static | tee -a "$GITHUB_STEP_SUMMARY"; test "${PIPESTATUS[0]}" -eq 0

  go:
    name: Go (rk-nri vet, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rk-nri/go.mod
          cache-dependency-path: rk-nri/go.mod

      - name: vet, test, static build
        working-directory: rk-nri
        run: |
          # Autofix commits go.sum; tidy keeps a push before that buildable.
          # Module checksums are verified against sum.golang.org either way.
          go mod tidy
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o rk-nri .

      # Known vulnerabilities reachable from rk-nri, the standard library
      # included (docs/design/phase-12.md §4.3). govulncheck is pinned in go.mod.
      - name: govulncheck
        working-directory: rk-nri
        run: go tool govulncheck ./...

      # Last, so a formatting nit never hides test results.
      - name: gofmt
        if: always()
        working-directory: rk-nri
        run: test -z "$(gofmt -l .)" || { gofmt -d .; echo "::error::run gofmt (autofix does this on phase branches)"; exit 1; }

  # docs/design/phase-8.md §3.5: userspace line coverage, report-only.
  coverage:
    name: Coverage (userspace, report-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov (userspace crates)
        run: >-
          .github/scripts/run-logged.sh coverage cargo llvm-cov --no-report
          -p rk-policy -p rk-sensor -p rk-agentd -p rk-ebpf-common -p rk-cli

      - name: Reports (lcov, HTML, summary)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          python3 tests/coverage_summary.py coverage.json "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html
