name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt, clippy, deny, audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny,cargo-audit

      - name: rustfmt
        run: .github/scripts/run-logged.sh rustfmt cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: .github/scripts/run-logged.sh clippy cargo clippy --workspace --all-targets --keep-going -- -D warnings

      - name: cargo-deny (licenses, bans, sources, advisories)
        run: .github/scripts/run-logged.sh cargo-deny cargo deny check

      - name: cargo-audit
        run: .github/scripts/run-logged.sh cargo-audit cargo audit

  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Includes the ABI layout assertions, which therefore run natively on both arches.
      - name: cargo test
        run: .github/scripts/run-logged.sh "cargo test (${{ matrix.arch }})" cargo test --workspace

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: pytest
        run: .github/scripts/run-logged.sh pytest pytest tests/ -v

  go:
    name: Go (rk-nri vet, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rk-nri/go.mod
          cache-dependency-path: rk-nri/go.mod

      - name: gofmt
        working-directory: rk-nri
        run: test -z "$(gofmt -l .)" || { gofmt -d .; echo "::error::run gofmt (autofix does this on phase branches)"; exit 1; }

      - name: vet, test, static build
        working-directory: rk-nri
        run: |
          # Autofix commits go.sum; tidy keeps a push before that buildable.
          # Module checksums are verified against sum.golang.org either way.
          go mod tidy
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o rk-nri .
