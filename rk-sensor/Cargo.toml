[package]
name = "rk-sensor"
description = "Reality Kernel host sensor: loads the BPF objects, drains events, runs the selftest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rk-sensor"
path = "src/main.rs"

[features]
default = []
# Embed rk-bpf/build/<arch>/*.bpf.o into the binary. Required for release builds.
embedded-bpf = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
aya.workspace = true
bytemuck.workspace = true
hex.workspace = true
libc.workspace = true
lru.workspace = true
# Plain HTTP only: OTLP goes to a node-local collector, which owns TLS to
# the backend. No TLS stack keeps the static musl build pure Rust.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rk-audit = { path = "../rk-audit" }
rk-ebpf-common = { path = "../rk-ebpf-common" }
rk-policy = { path = "../rk-policy" }
rk-agentd = { path = "../rk-agentd" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# "net" for the metrics listener (docs/design/phase-9.md §3.5).
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
