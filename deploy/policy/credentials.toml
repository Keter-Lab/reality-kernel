# Built-in file deny list: local credential stores.
#
# Included in every profile unless an administrator removes it explicitly
# (`files.include = []`). Entries that do not exist on a host are skipped.
# Changes to this file need review from a CODEOWNER (Phase 11).

name = "credentials"
description = "Local password, sudo and SSH credential stores"

[[deny]]
path = "/etc/shadow"
access = ["all"]

[[deny]]
path = "/etc/gshadow"
access = ["all"]

[[deny]]
path = "/etc/sudoers"
access = ["all"]

[[deny]]
path = "/etc/sudoers.d"
subtree = true
access = ["all"]

[[deny]]
path = "/etc/ssh"
subtree = true
access = ["all"]

[[deny]]
path = "/root/.ssh"
subtree = true
access = ["all"]
