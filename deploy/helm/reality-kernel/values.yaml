# Reality Kernel DaemonSet. Host requirements: docs/install.md and docs/kernel-matrix.md.

image:
  repository: ghcr.io/keter-lab/reality-kernel
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Profiles in the policy language (docs/policy.md), as TOML. Pods select one
# with the annotation `realitykernel.dev/profile: NAME`.
#
# On kernels without BPF LSM (`bpf` missing from /sys/kernel/security/lsm),
# only network rules can be enforced: profiles must then set
# `network.deny_raw_sockets = false` and `files.include = []`, and have no
# `[exec]` section, or the policy is refused. `rk status` shows which applies.
profiles: |
  [profiles.restricted]
  mode = "enforce"
  network.default = "deny"

  [profiles.restricted.exec]
  default = "deny"
  allow = []

# Namespaces that must be governed. A pod there without an annotation gets
# `default`; an annotation must name a profile in `allowed`. Example:
#   agents:
#     default: restricted
#     allowed: [restricted]
namespaces: {}

# Extra policy TOML appended verbatim (bindings, more profiles). Prefer
# `namespaces` for `[kubernetes]` rules.
extraPolicy: ""

# While rk-sensor is unreachable, rk-nri cannot know the policy, so it refuses
# every container except unannotated pods in these namespaces (the chart's own
# namespace is always added, so rk-sensor can restart). Keep this to system
# namespaces that are never governed; a namespace with rules must not be here.
exemptNamespaces:
  - kube-system

# What rk-nri does when rk-sensor is unreachable and a container is not exempt
# (above). Fail refuses the container: the secure default, and what the docs
# promise ("if the binding fails, the container doesn't start"). Ignore starts
# it UNGOVERNED, with a warning in the rk-nri log for each one: an explicit
# opt-out of enforcement for clusters that put availability first.
failurePolicy: Fail

# Seconds without the sensor's heartbeat before governed ENFORCE workloads
# are denied everything (docs/design/phase-6.md §4). Fail-closed by design.
heartbeatTimeoutSeconds: 10

# Kubernetes cgroup root relative to /sys/fs/cgroup, or `auto`.
k8sCgroupRoot: auto

nri:
  socket: /var/run/nri/nri.sock
  # Order among NRI plugins: two digits, lower runs first.
  pluginIndex: "10"

logLevel: info

# Phase 9 (docs/audit.md). The audit log is hash-chained and signed with a
# per-node key generated on first start; both stay on the host.
audit:
  hostPath: /var/log/reality-kernel
  keyHostPath: /var/lib/reality-kernel
  # Also record allowed decisions (network allows, committed execs).
  includeAllow: false

# Prometheus endpoint on the pod IP, with scrape annotations.
metrics:
  enabled: true
  port: 9464

# OTLP/HTTP collector on the node, e.g. http://$(HOST_IP):4318. Plain HTTP:
# the collector handles TLS to its backend. Empty disables export.
otlp:
  endpoint: ""

nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - operator: Exists
priorityClassName: system-node-critical
resources:
  sensor: {}
  nri: {}
