apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "rk.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rk.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rk.selector" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "rk.selector" . | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      # /proc/<pid>/cgroup of containers must resolve: rk-sensor reads it from
      # PID 1's cgroup namespace (docs/design/phase-5b.md §5).
      hostPID: true
      priorityClassName: {{ .Values.priorityClassName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rk-sensor
          image: {{ include "rk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/rk-sensor
            - --policy
            - /etc/rk/policy.toml
            - --watch-policy
            - --k8s-cgroup-root
            - {{ .Values.k8sCgroupRoot | quote }}
            # Phase 6: pins in the host bpffs and state on the host survive a pod
            # replacement, so protection never pauses (docs/design/phase-6.md §3).
            - --heartbeat-timeout
            - {{ .Values.heartbeatTimeoutSeconds | quote }}
            - --state-file
            - /var/run/reality-kernel/engine-state.json
            # Phase 9: the signed audit log and its key live on the host, so
            # the hash chain continues across pod replacements.
            - --audit-dir
            - /var/log/reality-kernel/audit
            - --audit-key
            - /var/lib/reality-kernel/audit.key
            {{- if .Values.audit.includeAllow }}
            - --audit-allow
            {{- end }}
            - --metrics-addr
            {{- if .Values.metrics.enabled }}
            - {{ printf "0.0.0.0:%v" .Values.metrics.port | quote }}
            {{- else }}
            - "off"
            {{- end }}
            {{- with .Values.otlp.endpoint }}
            - --otlp-endpoint
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          securityContext:
            # Loads BPF programs, writes maps, enters the host cgroup namespace.
            privileged: true
          readinessProbe:
            exec:
              command: ["/usr/local/bin/rk", "status"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.sensor | nindent 12 }}
          volumeMounts:
            - name: policy
              mountPath: /etc/rk
              readOnly: true
            - name: run-rk
              mountPath: /run/rk
            - name: cgroup
              mountPath: /sys/fs/cgroup
            - name: securityfs
              mountPath: /sys/kernel/security
              readOnly: true
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            - name: state
              mountPath: /var/run/reality-kernel
            - name: audit
              mountPath: /var/log/reality-kernel
            - name: audit-key
              mountPath: /var/lib/reality-kernel
        - name: rk-nri
          image: {{ include "rk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/rk-nri
            - -agentd-socket
            - /run/rk/agentd.sock
            - -nri-socket
            - {{ .Values.nri.socket | quote }}
            - -idx
            - {{ .Values.nri.pluginIndex | quote }}
            - -failure-policy
            - {{ .Values.failurePolicy | quote }}
            - -governed-namespaces
            - {{ keys .Values.namespaces | sortAlpha | join "," | quote }}
          # Ready only once registered with NRI: before that, containers on
          # this node start without passing through rk-nri.
          readinessProbe:
            exec:
              command: ["/usr/local/bin/rk-nri", "-check-ready"]
            periodSeconds: 5
          securityContext:
            # Root only to reach the root-owned NRI and agentd sockets.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources.nri | nindent 12 }}
          volumeMounts:
            - name: run-rk
              mountPath: /run/rk
            - name: nri
              mountPath: {{ dir .Values.nri.socket }}
      volumes:
        - name: policy
          configMap:
            name: {{ include "rk.name" . }}-policy
        - name: run-rk
          emptyDir: {}
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: securityfs
          hostPath:
            path: /sys/kernel/security
            type: Directory
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/run/reality-kernel
            type: DirectoryOrCreate
        - name: audit
          hostPath:
            path: {{ .Values.audit.hostPath }}
            type: DirectoryOrCreate
        - name: audit-key
          hostPath:
            path: {{ .Values.audit.keyHostPath }}
            type: DirectoryOrCreate
        - name: nri
          hostPath:
            path: {{ dir .Values.nri.socket }}
            type: DirectoryOrCreate
