apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rk.name" . }}-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rk.labels" . | nindent 4 }}
data:
  # rk-sensor --watch-policy applies changes to this file in place, with the
  # usual atomic flip; the pod is not restarted (docs/design/phase-5b.md §7).
  policy.toml: |
    {{- include "rk.policy" . | nindent 4 }}
