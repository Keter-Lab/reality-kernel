id = "exec-allowlist"
text = "ENFORCE: unlisted executables are denied, listed ones run"
tests = ["vm:exec_enforce_unlisted_denied", "vm:exec_enforce_listed_runs"]

[[criterion]]
phase = "3"
id = "exec-identity"
text = "Exec decisions follow file identity: symlinks, replaced binaries, scripts, unlinked files"
tests = ["vm:exec_symlink_resolves_to_target", "vm:exec_replaced_binary_denied_until_reload",
         "vm:exec_script_requires_interpreter", "vm:exec_unlinked_denied", "vm:exec_unlinked_override_allows"]

[[criterion]]
phase = "3"
id = "exec-events"
text = "Exec events carry the full argv, with a truncation flag when cut"
tests = ["vm:exec_records_full_argv", "vm:exec_records_truncation_flag"]

[[criterion]]
phase = "3"
id = "exec-audit"
text = "AUDIT reports would-deny for exec"
tests = ["vm:exec_audit_reports_would_deny"]

[[criterion]]
phase = "3"
id = "exec-reload-quarantine"
text = "Exec policy reload is atomic; quarantine blocks exec and network"
tests = ["vm:exec_reload_atomic", "vm:exec_quarantine_blocks_exec_and_network"]

[[criterion]]
phase = "3"
id = "exec-ungoverned"
text = "Ungoverned processes are untouched by exec policy"
tests = ["vm:exec_ungoverned_untouched", "vm:exec_unbound_sibling_untouched"]

