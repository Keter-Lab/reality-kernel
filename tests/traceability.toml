tests = ["py:test_readme_claims_have_evidence", "py:test_claim_without_evidence_fails", "py:test_unknown_criterion_fails_in_readme_and_docs", "py:test_numbers_and_superlatives_outside_claims_fail", "py:test_stale_evidence_page_fails"]

[[criterion]]
phase = "11"
id = "dco"
text = "Every commit in a pull request is signed off by its author under the DCO; bot commits are exempt"
tests = ["ci:dco", "py:test_signed_off_commits_pass", "py:test_missing_or_foreign_sign_off_fails", "py:test_bot_commits_are_exempt"]

[[criterion]]
phase = "12"
id = "retired_product_removed"
text = "The repository holds only the open-source project: the hosted API, its backend crates, the analysis engine and the SDK are gone, and the workspace has only the product crates"
tests = ["py:test_retired_product_is_gone"]

[[criterion]]
phase = "12"
id = "release_complete"
text = "The release builds every binary the Helm chart runs, and the release job can verify its own image while the package is still private"
tests = ["py:test_release_builds_every_chart_binary", "py:test_release_job_logs_in_before_verifying", "ci:release"]

[[criterion]]
phase = "12"
id = "go_vulnerabilities"
text = "rk-nri builds with a pinned, current Go toolchain, and CI fails on any known vulnerability reachable from it, the standard library included"
tests = ["py:test_go_vulnerabilities_are_checked", "ci:go"]

[[criterion]]
phase = "12"
id = "site_honest"
text = "The website has no broken links, nothing of the retired product, no performance number or superlative, and no inline script or style, so it runs under a strict Content-Security-Policy"
tests = ["py:test_site_links_resolve", "py:test_site_has_no_retired_product", "py:test_site_claims_rules", "py:test_site_fits_the_content_security_policy", "py:test_site_partials_current", "py:test_site_config_and_sitemap"]

# ---- Phase 16: TUN/TAP containment ----------------------------------------

[[criterion]]
phase = "16"
id = "tun-containment"
text = "ENFORCE: a governed process cannot create a TUN/TAP interface, attach to one (even one its own user owns, with no capability), or re-attach a detached queue; AUDIT records each as audit_would_deny; ungoverned processes and profiles with deny_raw_sockets = false are unaffected"
tests = ["vm:tun_attach_owned_ungoverned", "vm:tun_create_denied", "vm:tun_attach_owned_denied",
         "vm:tun_attach_queue_denied", "vm:tun_audit_would_deny", "vm:tun_allowed_without_flag",
         "unit:decodes_tun", "unit:tun_operations_are_named"]

# ---- Release v0.2.0: adoption (docs/design/adoption.md) ---------------------

[[criterion]]
phase = "v0.2.0"
id = "adoption"
text = "One command installs a verified release (a tampered package is refused); rk init writes a starter AUDIT profile that fits the host and never replaces a policy in use; rk policy suggest turns a verified audit log into an ENFORCE profile under which the learned connections and executables work, everything unobserved is denied, and secret files stay denied"
tests = ["vm:adoption_round_trip", "pkg:pkg_fresh_install_enforces", "pkg:pkg_init_suggest",
         "py:test_install_script_refuses_a_tampered_package", "py:test_install_script_checks_before_it_installs",
         "py:test_install_script_pins_the_release_identity",
         "unit:starter_with_bpf_lsm_learns_network_exec_and_secrets", "unit:starter_without_bpf_lsm_is_network_only",
         "unit:a_policy_in_use_is_never_replaced", "unit:suggests_an_enforce_profile_from_would_denies",
         "unit:a_log_that_does_not_verify_is_refused", "unit:no_records_is_an_error_not_an_empty_allow_list"]

[[criterion]]
phase = "v0.2.0"
id = "cli-cannot-be-steered"
text = "rk init and rk policy suggest --out, run as root, never write through a symbolic link planted at the policy, staging, backup or output path; suggest keeps the observed port ranges (at most eight per address, the rest reported) instead of widening them, and never learns an executable whose file was replaced after it ran"
tests = ["unit:root_writes_never_follow_a_planted_symlink", "unit:replace_overwrites_a_regular_file_atomically",
         "unit:backup_never_follows_a_planted_symlink", "unit:out_never_writes_through_a_planted_symlink",
         "unit:observed_port_ranges_are_never_widened", "unit:a_replaced_executable_is_not_learned"]
