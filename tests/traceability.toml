id = "doctor"
text = "rk doctor explains missing kernel features, and passes on every supported kernel"
tests = ["vm:doctor_passes_on_supported_kernels", "unit:healthy_host_passes", "unit:missing_bpf_lsm_is_explained_as_a_warning", "unit:blocking_problems_fail", "unit:kernel_versions_are_graded", "unit:stale_pins_without_a_sensor_are_flagged"]

[[criterion]]
