# ---- Phase 8: test strategy ----------------------------------------------

[[criterion]]
phase = "8"
id = "traceability"
text = "Every acceptance criterion maps to named tests that exist, would run (no #[ignore]d or non-test Rust fn, no skipped Python test, no disabled or emptied CI job), and passed on every kernel"
tests = ["py:test_repository_index_is_complete", "py:test_reports_flag_missing_kernel", "ci:traceability",
         "py:test_static_flags_an_ignored_or_non_test_rust_fn", "py:test_static_flags_a_skipped_python_test",
         "py:test_static_flags_an_emptied_ci_job", "py:test_static_flags_a_disabled_ci_job"]

[[criterion]]
phase = "8"
id = "conformance"
text = "The policy conformance corpus agrees with both the userspace evaluator and the kernel"
tests = ["unit:conformance_corpus_is_well_formed", "unit:conformance_userspace", "vm:conformance_kernel"]

[[criterion]]
phase = "8"
id = "fuzzing"
text = "The event decoder and the policy compiler are fuzzed on every run"
tests = ["ci:fuzz"]

[[criterion]]
phase = "8"
id = "properties"
