[[criterion]]
phase = "9"
id = "otlp"
text = "Decisions in an agent session are exported as OTLP spans in the session's trace, which the launched agent also receives"
tests = ["unit:spans_join_the_session_trace", "unit:exports_to_a_collector", "unit:a_full_queue_counts_the_loss", "unit:traceparent_is_w3c_shaped_and_stable"]

[[criterion]]
phase = "9"
id = "process_table"
text = "The process table enriches records from exec records, falls back to procfs, is bounded, and says where enrichment came from"
tests = ["unit:exec_records_fill_the_table_and_procfs_adds_the_parent", "unit:misses_fall_back_to_procfs_and_exited_processes_are_unavailable", "unit:the_table_is_bounded"]

[[criterion]]
phase = "10"
id = "upgrade_continuous"
text = "Upgrade keeps enforcement continuous: a different object replaces the running one with zero denied actions getting through"
tests = ["vm:upgrade_replaces_object_without_gap", "vm:upgrade_gap_detector_works", "pkg:pkg_upgrade_keeps_enforcement", "unit:reconcile_drops_an_unfinished_replacement", "unit:reconcile_completes_an_interrupted_switch", "unit:finish_replacement_swaps_and_abort_keeps_the_old_set"]

