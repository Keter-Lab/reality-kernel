# Acceptance criterion → named tests (docs/design/phase-8.md §3.1).
#
# Checked by tests/traceability.py: statically (every test exists in the
# source; every criterion has a test) and, in CI, against the run's reports
# (every vm: and k8s: test passed, on every kernel for vm:).
#
# Test kinds:
#   vm:NAME   run_test in tests/integration/src/{main,agent,resilience}.rs; runs on all five kernels
#   k8s:NAME  run_test in tests/k8s/run.sh; runs in the kind job
#   unit:NAME Rust #[test] fn anywhere in the workspace (CI test job)
#   go:NAME   Go test function in rk-nri (CI go job)
#   py:NAME   pytest function under tests/ (CI python job)
#   ci:NAME   a job in .github/workflows/*.yml whose success is the evidence

# ---- Phase 2: network policy ---------------------------------------------

[[criterion]]
phase = "2"
id = "net-enforce-eperm"
text = "ENFORCE: the deny set gives EPERM over TCP and UDP, IPv4 and IPv6"
tests = ["vm:net_enforce_tcp_v4", "vm:net_enforce_tcp_v6", "vm:net_enforce_udp_connect_v4",
         "vm:net_enforce_udp_connect_v6", "vm:net_enforce_udp_sendmsg_v4",
         "vm:net_enforce_udp_sendmsg_v6", "vm:net_enforce_v4_mapped"]

[[criterion]]
phase = "2"
id = "net-telemetry-independent"
text = "Verdicts are the same with the consumer paused, and when every emit fails"
tests = ["vm:net_verdicts_independent_of_telemetry", "vm:net_verdicts_with_emit_failing"]

[[criterion]]
phase = "2"
id = "net-audit"
text = "AUDIT: operations succeed and report audit-would-deny with the rule id"
tests = ["vm:net_audit_reports_rule_id"]

[[criterion]]
phase = "2"
id = "net-ungoverned"
text = "Processes outside governed cgroups are unaffected"
tests = ["vm:net_ungoverned_untouched", "vm:net_unbound_sibling_untouched"]

[[criterion]]
phase = "2"
id = "net-atomic-reload"
text = "Policy reload is atomic"
tests = ["vm:net_reload_atomic"]

[[criterion]]
phase = "2"
id = "net-bypasses"
text = "Raw/packet sockets, io_uring, TCP Fast Open and NAT64 can't bypass the rules"
tests = ["vm:net_raw_socket_denied", "vm:net_packet_vnet_hdr_denied", "vm:net_io_uring_connect_denied",
         "vm:net_tcp_fastopen_denied", "vm:net_nat64_equivalence"]

[[criterion]]
phase = "2"
id = "net-compiler"
text = "The compiled kernel lookup always agrees with the reference evaluator"
tests = ["unit:compiled_lookup_matches_reference"]

# ---- Phase 3: exec policy ------------------------------------------------

[[criterion]]
