name = "nat64_equivalence"
description = "An IPv4 deny also covers the NAT64 (64:ff9b::/96) form of the address, on by default"
policy = """
[profiles.case]
mode = "enforce"
network.default = "allow"

[[profiles.case.network.deny]]
cidr = "10.99.0.5/32"
proto = ["udp"]
"""

[[op]]
kind = "connect"
target = "[64:ff9b::a63:5]:80"
proto = "udp"
expect = "deny"
