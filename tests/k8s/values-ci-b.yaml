# Policy B (k8s_configmap_update_applies): values-ci.yaml plus a deny of
# 10.99.0.2.
image:
  repository: reality-kernel
  tag: ci
  pullPolicy: Never
profiles: |
  [profiles.k8s-net]
  mode = "enforce"
  network.default = "allow"
  network.deny_raw_sockets = false

  [[profiles.k8s-net.network.deny]]
  cidr = "10.99.0.1/32"
  proto = ["tcp", "udp"]

  [[profiles.k8s-net.network.deny]]
  cidr = "10.99.0.2/32"
  proto = ["tcp", "udp"]

  [profiles.k8s-net.files]
  include = []

  [profiles.k8s-open]
  mode = "enforce"
  network.default = "allow"
  network.deny_raw_sockets = false

  [profiles.k8s-open.files]
  include = []
namespaces:
  agents:
    default: k8s-net
    allowed: [k8s-net]
