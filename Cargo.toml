[workspace]
resolver = "2"
members = [
  "rk-ebpf-common",
  "rk-sensor",
  "rk-audit",
  "rk-policy",
  "rk-agentd",
  "rk-cli",
  "xtask",
  "tests/integration",
]
# Standalone workspace (nightly + sanitizers); see fuzz/Cargo.toml.
exclude = [
  "fuzz",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
aya = "0.14"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.19"
uuid = { version = "1", features = ["v4"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
proptest = "1"
libc = "0.2"
toml = "1"
ipnet = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
