[workspace]
resolver = "2"
members = [
  "rk-ebpf-common",
  "rk-ebpf-probes",
  "rk-sensor",
  "rk-supabase",
  "rk-signing",
  "rk-policy",
  "rk-api",
  "rk-engine-core",
  "rk-session",
  "rk-types",
  "rk-cli",
  "xtask",
  "tests/parity",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
aya = "0.13"
aya-log = "0.2"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
http = "1"
hyper = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
shell-words = "1"
unicode-normalization = "0.1"
lru = "0.12"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ipnet = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
zeroize = "1"
